services:
  corba-pdf-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corba-pdf-service
    image: corba-pdf-service:latest

    ports:
      - "8080:8080"
      - "1050:1050"

    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=default
      - CORBA_SERVER_HOST=localhost
      - CORBA_SERVER_PORT=1050
      - JAVA_OPTS=-Xms256m -Xmx512m -Djava.awt.headless=true

    dns:
      - 8.8.8.8
      - 8.8.4.4

    restart: unless-stopped

    networks:
      - corba-network

volumes:
  pdf-temp:
    driver: local

networks:
  corba-network:
    driver: bridge
    name: corba-pdf-network